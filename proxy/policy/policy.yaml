# Egress policy: allowlist the action, not the domain.
# Hot-reloaded when this file changes; a broken edit keeps the last good policy.
#
# A request's destination (the CONNECT target) must match a rule's hosts, and its path one of the
# rule's `paths` if it lists any; the first such rule applies. No rule: denied.
# `checks` turns on the rest, one at a time (POLICY_CHECKS overrides it for the staged runs):
#   actions   rule `methods`
#   github    rule `github_owners`: reads and clones anywhere, writes only to these owners' repos
#   mcp       rule `mcp_tools`: a remote MCP endpoint may only be sent tools/call for these tools,
#             and its tools/list answers are filtered to them
#   sni_host  TLS SNI and Host header must both equal the destination (domain fronting)
#   secrets   secret-shaped strings in the path, query, headers or body, including base64-decoded
#   entropy   long high-entropy strings in the path or query
checks: [actions, github, mcp, sni_host, secrets, entropy]

rules:
  - name: anthropic-api
    hosts: [api.anthropic.com]
    methods: [GET, HEAD, POST]   # HEAD /api/hello: Claude Code's connectivity check (seen in proxy-dns)
    inspect: false        # carries prompts, and so the repo's content, by design: not scanned, not logged

  - name: github
    hosts: [github.com, api.github.com, codeload.github.com, raw.githubusercontent.com,
            objects.githubusercontent.com, gh-standin.test]
    github_owners: [s4steve]
    allow_auth_header: true   # git and gh send a GitHub token to GitHub; M5's broker replaces this

  - name: python-packages
    hosts: [pypi.org, files.pythonhosted.org, pypi-standin.test]
    methods: [GET, HEAD]

  - name: npm
    hosts: [registry.npmjs.org]
    methods: [GET, HEAD]

  - name: docs-mcp            # a remote (streamable HTTP) MCP server; before `docs`, which has no paths
    hosts: [docs.test]
    paths: [/mcp]
    methods: [GET, POST, DELETE]
    mcp_tools: [search_docs]

  - name: docs
    hosts: [docs.python.org, docs.test]
    methods: [GET, HEAD]

# Credential broker (M5). The agent holds the placeholder; the proxy holds the secret, in a file
# mounted into the proxy only (setups/proxy-broker). Allowed requests to `hosts` that carry the
# placeholder in `headers` get the secret instead (Basic auth is decoded and re-encoded). The
# placeholder anywhere else is the `broker_placeholder` detector (part of `secrets`).
# Responses that echo the secret are scrubbed back to the placeholder (not streamed ones).
credentials:
  - name: github
    placeholder: egress-broker-placeholder-github
    secret_file: /secrets/github_token
    hosts: [github.com, api.github.com, gh-standin.test]
